{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hermit.fullname" . }}
  labels:
    {{- include "hermit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hermit.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.config.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
