apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermit.fullname" . }}
  labels:
    {{- include "hermit.labels" . | nindent 4 }}
data:
  HERMIT_GIT_PROVIDER: {{ .Values.config.gitProvider | quote }}
  HERMIT_GIT_HOST_URL: {{ .Values.config.gitHostUrl | quote }}
  HERMIT_VLLM_ENDPOINT: {{ .Values.config.vllmEndpoint | quote }}
  HERMIT_MODEL: {{ .Values.config.model | quote }}
  {{- if .Values.config.reviewRules }}
  HERMIT_REVIEW_RULES: {{ .Values.config.reviewRules | quote }}
  {{- end }}
  HERMIT_OPCODE_BIN: {{ .Values.config.opencodeBin | quote }}
  HERMIT_WORKSPACE: {{ .Values.config.workspace | quote }}
  HERMIT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HERMIT_PORT: {{ .Values.service.port | quote }}
  HERMIT_MASTER_URL: {{ .Values.config.masterUrl | default (printf "http://%s:%d" (include "hermit.fullname" .) (int .Values.service.port)) | quote }}
  HERMIT_POD_IMAGE: {{ .Values.config.podImage | default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) | quote }}
  HERMIT_POD_NAMESPACE: {{ .Values.config.podNamespace | quote }}
  HERMIT_POD_SERVICE_ACCOUNT: {{ .Values.config.podServiceAccount | quote }}
  HERMIT_REPORT_TIMEOUT_SECONDS: {{ .Values.config.reportTimeoutSeconds | quote }}
  HERMIT_OPCODE_INIT_IMAGE: {{ .Values.config.opencodeInitImage | quote }}
  HERMIT_OPCODE_INIT_BIN_PATH: {{ .Values.config.opencodeInitBinPath | quote }}
  HERMIT_POLICY_FILE_PATH: {{ .Values.config.policyFilePath | quote }}
  HERMIT_POD_CPU_REQUEST: {{ .Values.config.podResources.requests.cpu | quote }}
  HERMIT_POD_MEMORY_REQUEST: {{ .Values.config.podResources.requests.memory | quote }}
  HERMIT_POD_CPU_LIMIT: {{ .Values.config.podResources.limits.cpu | quote }}
  HERMIT_POD_MEMORY_LIMIT: {{ .Values.config.podResources.limits.memory | quote }}
  HERMIT_RATE_LIMIT_PER_IP: {{ .Values.config.rateLimitPerIp | quote }}
  HERMIT_RATE_LIMIT_GLOBAL: {{ .Values.config.rateLimitGlobal | quote }}
  HERMIT_RATE_LIMIT_WINDOW_SECONDS: {{ .Values.config.rateLimitWindowSeconds | quote }}
  HERMIT_TRUST_X_FORWARDED_FOR: {{ .Values.config.trustXForwardedFor | quote }}
  HERMIT_MAX_BODY_BYTES: {{ int .Values.config.maxBodyBytes | quote }}
  HERMIT_MAX_CONCURRENT_JOBS: {{ .Values.config.maxConcurrentJobs | quote }}
  HERMIT_OPCODE_TIMEOUT_SECONDS: {{ .Values.config.opencodeTimeoutSeconds | quote }}
  HERMIT_ABANDONED_JOB_TIMEOUT_SECONDS: {{ .Values.config.abandonedJobTimeoutSeconds | quote }}
  HERMIT_OPCODE_INIT_IMAGE_PULL_POLICY: {{ .Values.config.opencodeInitImagePullPolicy | quote }}
  HERMIT_POD_IMAGE_PULL_POLICY: {{ .Values.config.podImagePullPolicy | quote }}
  {{- if .Values.config.opencodeArgs }}
  HERMIT_OPCODE_ARGS: {{ join " " .Values.config.opencodeArgs | quote }}
  {{- end }}
  {{- if or .Values.caBundle.configMap .Values.caBundle.secret }}
  {{- $key := .Values.caBundle.secretKey }}
  {{- if .Values.caBundle.configMap }}
  {{- $key = .Values.caBundle.configMapKey }}
  {{- end }}
  HERMIT_CA_BUNDLE_PATH: {{ printf "%s/%s" .Values.caBundle.mountPath $key | quote }}
  HERMIT_POD_CA_MOUNT_PATH: {{ .Values.caBundle.mountPath | quote }}
  HERMIT_POD_CA_CONFIGMAP: {{ .Values.caBundle.configMap | quote }}
  HERMIT_POD_CA_SECRET: {{ .Values.caBundle.secret | quote }}
  {{- end }}