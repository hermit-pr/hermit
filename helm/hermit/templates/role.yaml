apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hermit.fullname" . }}
  labels:
    {{- include "hermit.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
