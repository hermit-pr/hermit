replicaCount: 1

image:
  # Built and pushed by the docker-build CI job.
  repository: registry.gitlab.com/hermit-bot/hermit
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermit.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: hermit-tls
  #    hosts:
  #      - hermit.example.com

config:
  gitProvider: github
  gitHostUrl: https://github.example.com
  vllmEndpoint: http://vllm.example.com:8000/v1
  model: llama-3.1-8b-instruct
  # Optional. Extra output instructions appended to the bot's hardcoded
  # default review output; never replaces the internal operating prompt.
  reviewRules: ""
  # Comment trigger tags. A comment matching any of these on a PR/MR
  # spawns a review. Default: ["@hermit", "/recheck"]
  triggerTags:
    - "@hermit"
    - "/recheck"
  opencodeBin: opencode
  opencodeInitImage: "ghcr.io/anomalyco/opencode:latest"
  opencodeInitBinPath: "/usr/local/bin/opencode"
  workspace: /workspace
  # Project policy file extracted from the base commit and handed to reviewers.
  policyFilePath: AGENTS.md
  logLevel: info
  # URL reviewer pods use to report back; defaults to
  # http://<release-name>-hermit:<port>
  masterUrl: ""
  # Image used to run reviewer (slave) pods; defaults to the master image.
  podImage: ""
  podNamespace: ""
  # ServiceAccount used by the master Deployment (needs pod+secret RBAC).
  serviceAccountName: hermit-master
  # ServiceAccount assigned to reviewer (slave) pods. Reviewer pods do
  # not receive a RoleBinding — they only need to exist in the namespace.
  podServiceAccount: hermit-reviewer
  reportTimeoutSeconds: 1800
  abandonedJobTimeoutSeconds: 3600
  # Resource requests/limits for reviewer (slave) pods.
  podResources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  podImagePullPolicy: IfNotPresent
  opencodeInitImagePullPolicy: IfNotPresent
  opencodeTimeoutSeconds: 900
  maxConcurrentJobs: 20
  maxBodyBytes: 10485760
  rateLimitPerIp: 60
  rateLimitGlobal: 600
  rateLimitWindowSeconds: 60
  trustXForwardedFor: false
  # When true (default), @hermit comments are rejected when the commenter is
  # not a member of the org (GitHub) or group (GitLab). Set to false to allow
  # non-members to trigger reviews via @hermit comments.
  requireCommenterMembership: true

# Egress restrictions for reviewer (slave) pods. When enabled, reviewer pods
# can only reach the master pod, kube-dns, and the configured git host and
# vLLM endpoint CIDRs. This prevents the opencode agent from making outbound
# connections to any other destination via bash (curl, wget, etc.).
networkPolicy:
  enabled: false
  # CIDR block of the on-premise Git host (GitHub Enterprise or GitLab).
  gitHostCidr: ""
  # TCP port of the Git host (default 443 for HTTPS).
  gitHostPort: 443
  # CIDR block of the self-hosted vLLM endpoint.
  vllmCidr: ""
  # TCP port of the vLLM endpoint (default 8000).
  vllmPort: 8000

# GitHub read/write and read-only tokens. For single-org deployments, set
# only ``token``. For multi-org deployments with Fine-Grained PATs, map each
# org to its PAT in ``orgs``; ``token`` acts as fallback for unmapped orgs.
# Either ``token`` or at least one ``orgs`` entry is required.
#
# Tokens MUST reference existing Kubernetes Secrets via ``secretName`` and
# ``secretKey`` — NEVER put token values inline. The chart injects them into
# the master pod via ``secretKeyRef``.
githubRwToken:
  token:
    secretName: ""
    secretKey: ""
  orgs: []
  # - name: myorg
  #   secretName: myorg-rw-secret
  #   secretKey: token
gitlabRwToken:
  token:
    secretName: ""
    secretKey: ""
githubReadToken:
  token:
    secretName: ""
    secretKey: ""
  orgs: []
  # - name: myorg
  #   secretName: myorg-read-secret
  #   secretKey: token

# Other secrets reference existing Kubernetes Secrets in the same namespace.
secrets:
  # Secret used to validate inbound webhooks (GitHub HMAC / GitLab token).
  webhookSecret:
    name: ""
    key: ""
  # Optional key used to derive deterministic, horizontally-shared job ids.
  # When unset, the webhook secret is used instead.
  jobIdSigningKey:
    name: ""
    key: ""
  # Optional API key the reviewer pods forward to the vLLM endpoint.
  vllmApiKey:
    name: ""
    key: ""

# Private PKI support for airgapped deployments. Reference an existing
# ConfigMap or Secret (same namespace) holding a PEM CA bundle under the given
# key. The bundle is mounted read-only into the master and into every reviewer
# pod and becomes the trust store for HTTPS calls (Git host, vLLM endpoint,
# git clone), so put your private root CA(s) in it.
# Precedence: configMap wins when both are set.
caBundle:
  # Existing ConfigMap holding the PEM bundle.
  configMap: ""
  configMapKey: "ca.pem"
  # Existing Secret holding the PEM bundle.
  secret: ""
  secretKey: "ca.pem"
  # Directory the bundle is mounted into.
  mountPath: /etc/hermit/ca

rbac:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}