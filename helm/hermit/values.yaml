replicaCount: 1

image:
  repository: registry.example.com/hermit
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

config:
  gitProvider: github
  gitHostUrl: https://github.example.com
  vllmEndpoint: http://vllm.example.com:8000/v1
  model: llama-3.1-8b-instruct
  reviewRules: |-
    Write the review as a single markdown comment with these four sections, in this order:
    - ## Critical changes that need to be fixed
    - ## Medium issues
    - ## Low issues
    - ## General feedback
    Put bugs, security holes and crashes under critical; logic problems and missing edge cases under medium; style and minor refactors under low. Be concise and concrete.
  opencodeBin: opencode
  opencodeArgs:
    - run
  opencodeInitImage: "ghcr.io/anomalyco/opencode:latest"
  opencodeInitBinPath: "/usr/local/bin/opencode"
  workspace: /workspace
  logLevel: info
  # URL reviewer pods use to report back; defaults to
  # http://<release-name>-hermit:<port>
  masterUrl: ""
  # Image used to run reviewer (slave) pods; defaults to the master image.
  podImage: ""
  podNamespace: ""
  podServiceAccount: hermit
  reportTimeoutSeconds: 1800

# Secrets are never stored in the chart or in values. Each entry references an
# existing Kubernetes Secret in the same namespace by name and key, so real
# tokens never appear in values files or the rendered manifests.
secrets:
  # Read-only token handed to reviewer pods for cloning the repository.
  gitReadToken:
    name: ""
    key: ""
  # Read/write token the master uses to post reviews on the configured
  # provider (GitHub or GitLab).
  gitRWToken:
    name: ""
    key: ""
  # Secret used to validate inbound webhooks (GitHub HMAC / GitLab token).
  webhookSecret:
    name: ""
    key: ""
  # Optional key used to derive deterministic, horizontally-shared job ids.
  # When unset, the webhook secret is used instead.
  reportSigningKey:
    name: ""
    key: ""
  # Optional API key the reviewer pods forward to the vLLM endpoint.
  vllmApiKey:
    name: ""
    key: ""

rbac:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}