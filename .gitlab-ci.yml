# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - build
  - test
  - secret-detection
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
secret_detection:
  stage: secret-detection

.python-base:
  image: python:3.13-slim
  cache:
    paths:
      - .pip-cache

python-lint:
  extends: .python-base
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --no-cache-dir -e '.[dev]'
    - black --check .
    - isort --check-only .
    - flake8 src tests
    - pylint src tests

python-test:
  extends: .python-base
  stage: test
  script:
    - pip install --no-cache-dir .
    - pip install --no-cache-dir pytest pytest-asyncio
    - pytest -v

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck docker/entrypoint.sh

shfmt:
  stage: test
  image: alpine:latest
  script:
    - apk add --no-cache shfmt
    - shfmt -i 2 -d docker/entrypoint.sh

helm-lint:
  stage: test
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - helm lint helm/hermit
    - helm template hermit helm/hermit > /dev/null

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -f docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: '$CI_REGISTRY_IMAGE'
